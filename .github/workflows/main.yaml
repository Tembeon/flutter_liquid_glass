name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

jobs:
  semantic_pull_request:
    name: Check PR Title
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  flutter-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      
      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🧪 Run Analyze
        run: melos run analyze

      - name: 📝 Run Tests without goldens
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'goldens')
        run: melos run test-without-goldens

      - name: 📝 Run Tests without goldens, with the production defaults
        run: melos run test:defaults


  skia_build:
    name: Skia Build Check
    # Web is a Skia-only target: its build fails if a pubspec shader cannot
    # compile to SkSL, so this guards the Skia compile path for consumers.
    # The liquid glass shaders are bundled by the build hook as .iplr instead.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🌐 Build example for web
        working-directory: packages/liquid_glass_renderer/example
        run: |
          flutter create --platforms web .
          flutter build web

  gles_device:
    name: OpenGL ES Device Tour
    # The gallery's tour on the Linux desktop engine, which draws with
    # Impeller's OpenGL ES backend over Mesa's software rasterizer: the
    # backend an Android device without a usable Vulkan driver falls back
    # to, and one neither flutter_tester nor the macOS job draws with. It
    # aborts the process on a pass it cannot encode, which fails the tour;
    # the tour itself checks that the engine draws with that backend.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🧰 Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev xvfb libgl1-mesa-dri libegl1 libgles2

      - name: 🖥️ Run the gallery on Impeller's OpenGL ES
        working-directory: packages/apple_liquid_glass/example
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms linux .
          rm -f test/widget_test.dart
          xvfb-run -a -s "-screen 0 1280x900x24" \
            flutter test integration_test/gallery_device_test.dart -d linux \
            --enable-impeller --enable-flutter-gpu

  check_generation:
    name: Check Code Generation
    timeout-minutes: 10
    runs-on: xcode-27
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🔨 Generate
        run: melos run generate

      - name: 🔎 Check there are no uncommitted changes
        run: |
          git add .
          git diff --cached --exit-code -- . \
            ':!**/GeneratedPluginRegistrant.swift'

  golden_tests:
    name: Run Golden Tests
    # Only run on main or if PR is labeled with "goldens"
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'goldens')
    # The macOS goldens are rendered with `flutter test --update-goldens`,
    # which must be run on a host matching this image's macOS version
    # (macOS 27.0.1 / 26A434, `xcode-27`).
    runs-on: xcode-27
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 📝 Run Test
        run: melos run coverage

      - name: 📊 Generate Coverage
        id: coverage-report
        uses: whynotmake-it/dart-coverage-assistant@v1.1
        with:
          # A fork's token cannot push the badge branch or open its pull request.
          generate_badges: ${{ github.repository == 'whynotmake-it/flutter_liquid_glass' && 'pr' || 'false' }}