name: apple_liquid_glass_example
description: A gallery of apple_liquid_glass - every control, menu and presentation on real glass.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: ">=3.47.0"

dependencies:
  apple_liquid_glass:
    path: ../
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  kinesis: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1

flutter:
  uses-material-design: false
  assets:
    - assets/backdrops/
