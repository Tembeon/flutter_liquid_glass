analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:lintervention/analysis_options.yaml

linter:
  rules:
    # Cascades read as a second statement glued onto the first; this package
    # writes one statement per line instead.
    cascade_invocations: false
