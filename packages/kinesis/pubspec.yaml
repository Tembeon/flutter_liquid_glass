name: kinesis
description: >-
  UIKit-grade motion for any Flutter app: springs that keep their velocity
  when retargeted, animation transactions, and time you can replay exactly.
version: 0.1.0-dev.1
publish_to: none

homepage: https://whynotmake.it
repository: https://github.com/whynotmake-it/flutter_liquid_glass/tree/main/packages/kinesis

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
